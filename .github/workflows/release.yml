name: Release

# Un tag vX.Y.Z (bun run release …) publie la version :
# archive de build prête à lancer + empreintes (Release GitHub) et image Docker (GHCR).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : les notes listent les commits depuis la version précédente.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tag et package.json concordent
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME ≠ package.json $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Archive de build
        run: |
          mkdir -p dist
          tar -czf "dist/twsb-v$VERSION.tar.gz" .output launcher package.json README.md
          (cd dist && sha256sum "twsb-v$VERSION.tar.gz" > checksums.txt)
          # CapRover : « Deploy via upload » de ce fichier (captain-definition vers l'image).
          bun scripts/caprover-tar.ts "$VERSION"

      - name: Notes de version
        run: |
          PREV="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          {
            echo "## Nouveautés"
            echo
            git log --no-merges --format='- %s' "${PREV:+$PREV..}$GITHUB_REF_NAME" \
              | grep -vE '^- Version [0-9]+\.[0-9]+\.[0-9]+$' || echo "- Corrections et améliorations"
            if [ -n "$PREV" ]; then
              echo
              echo "Détail : https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$GITHUB_REF_NAME"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release-notes.md est aussi joint : les sites le lisent sans l'API GitHub.
          gh release create "$GITHUB_REF_NAME" dist/* release-notes.md \
            --title "TWSB $VERSION" --notes-file release-notes.md --verify-tag

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
